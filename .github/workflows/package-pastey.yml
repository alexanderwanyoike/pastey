name: Package Pastey

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/package-pastey.yml"
      - "src/**"
      - "src-tauri/**"
      - "scripts/package-pastey.sh"
      - "scripts/install-pastey.sh"
      - "scripts/verify-distribution.mjs"
      - "scripts/write-pastey-update-manifest.mjs"
      - "package-lock.json"
      - "package.json"
      - "vite.config.ts"
  push:
    branches:
      - dev
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify distribution contract
        run: node scripts/verify-distribution.mjs

      - name: Install Linux desktop packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build AppImage
        env:
          PASTEY_CREATE_UPDATER_ARTIFACTS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/package-pastey.sh

      - name: Normalize artifact names
        run: |
          mkdir -p dist/pastey-linux
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist/pastey-linux/pastey-x86_64.AppImage
          (cd dist/pastey-linux && sha256sum pastey-x86_64.AppImage > pastey-x86_64.AppImage.sha256)
          if compgen -G "src-tauri/target/release/bundle/appimage/*.AppImage.sig" > /dev/null; then
            cp src-tauri/target/release/bundle/appimage/*.AppImage.sig dist/pastey-linux/pastey-x86_64.AppImage.sig
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            test -f dist/pastey-linux/pastey-x86_64.AppImage.sig
            node scripts/write-pastey-update-manifest.mjs \
              "${GITHUB_REF_NAME}" \
              dist/pastey-linux/pastey-x86_64.AppImage.sig \
              dist/pastey-linux/latest.json
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pastey-linux-x86_64
          path: dist/pastey-linux/*
          if-no-files-found: error

      - name: Publish release assets for tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pastey-linux/*
