[package]
name = "pastey"
version = "0.1.2"
edition = "2021"
license = "MIT"
build = "build.rs"

[lib]
name = "pastey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.9.1", features = [] }
tauri-plugin-process = "2"
tauri-plugin-jolt = "0.1"
serde_json = "1"
tauri-plugin-updater = "2"
